<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دوال إكسل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F0;--card:#FFFFFF;--ink:#1D2A23;--sub:#5C6B62;--line:#D3DACD;--green:#1E6B46;--tint:#E2F0E7;--sel:#F4C542;--selink:#3A2B00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A16;--card:#1D261F;--ink:#E8EFE9;--sub:#97A89C;--line:#33403A;--green:#5BBE88;--tint:#223A2C;--sel:#F4C542;--selink:#3A2B00}}
:root[data-theme="dark"]{--bg:#141A16;--card:#1D261F;--ink:#E8EFE9;--sub:#97A89C;--line:#33403A;--green:#5BBE88;--tint:#223A2C;--sel:#F4C542;--selink:#3A2B00}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.7;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 32px;background-attachment:fixed}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}
header{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px}
h1{margin:0;font-size:24px;font-weight:700}
header p{margin:2px 0 0;color:var(--sub);font-size:14px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.fx{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fx b{padding:8px 12px;background:var(--tint);color:var(--green);font-family:Georgia,serif;font-style:italic;border-inline-end:1px solid var(--line)}
.fx input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 10px;outline:0;min-width:0}
.fx:focus-within{border-color:var(--green);box-shadow:0 0 0 2px var(--tint)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:4px 12px;border-radius:4px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--card)}
.count{color:var(--sub);font-size:13px;margin:4px 2px 8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.item button.head{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.item button.head:focus-visible{outline:2px solid var(--green);outline-offset:-2px;border-radius:6px}
.name{direction:ltr;font-family:Consolas,Menlo,monospace;font-weight:700;color:var(--green);background:var(--tint);padding:1px 8px;border-radius:3px;font-size:15px}
.short{flex:1;font-size:15px}
.cat{font-size:12px;color:var(--sub)}
.body{display:none;padding:2px 14px 14px;border-top:1px dashed var(--line)}
.item.open .body{display:block}
.lbl{font-size:13px;color:var(--sub);margin:10px 0 2px;font-weight:500}
.code{direction:ltr;text-align:left;font-family:Consolas,Menlo,monospace;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 10px;overflow-x:auto;white-space:nowrap}
.res{display:inline-block;margin-top:6px;background:var(--sel);color:var(--selink);font-weight:700;padding:1px 10px;border-radius:3px;font-size:14px}
.cp{margin-top:10px;border:1px solid var(--green);background:transparent;color:var(--green);font:inherit;font-size:14px;padding:4px 14px;border-radius:4px;cursor:pointer}
.cp:focus-visible,.chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
.tools{display:flex;justify-content:space-between;align-items:center}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:2px 10px;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="tools"><h1>دوال إكسل</h1><button class="theme" id="theme" type="button">الوضع</button></div>
<p>ابحث عن الدالة، اقرأ شرحها بالعربي، وانسخ الصيغة جاهزة.</p>
</header>
<div class="bar"><label class="fx"><b>fx</b><input id="q" type="search" placeholder="مثال: جمع، VLOOKUP، تاريخ" aria-label="بحث عن دالة"></label></div>
<div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
<div class="count" id="count" aria-live="polite"></div>
<div id="list"></div>
</div>
<script>
var F=[
["SUM","رياضيات","يجمع الأرقام","=SUM(A1:A5)","تجمع كل القيم في النطاق من A1 إلى A5. مثال: 10+20+30+40+50","150","جمع جمع الارقام مجموع"],
["SUMIF","رياضيات","جمع بشرط واحد","=SUMIF(A1:A5,\">20\",B1:B5)","تجمع قيم B فقط عندما تكون قيمة A المقابلة أكبر من 20.","90","جمع بشرط"],
["SUMIFS","رياضيات","جمع بعدة شروط","=SUMIFS(C:C,A:A,\"جدة\",B:B,\"يناير\")","تجمع عمود C للصفوف التي تحقق كل الشروط معًا: المدينة جدة والشهر يناير.","4,200","جمع بشروط متعددة"],
["PRODUCT","رياضيات","يضرب الأرقام","=PRODUCT(A1:A3)","تضرب القيم ببعضها. 2×3×4","24","ضرب"],
["ROUND","رياضيات","تقريب لعدد خانات","=ROUND(3.14159,2)","تقرّب الرقم إلى خانتين عشريتين.","3.14","تقريب"],
["ROUNDUP","رياضيات","تقريب لأعلى","=ROUNDUP(3.141,2)","تقرّب دائمًا للأعلى مهما كان الباقي.","3.15","تقريب لاعلى"],
["ABS","رياضيات","القيمة المطلقة","=ABS(-25)","تحذف الإشارة السالبة من الرقم.","25","موجب"],
["MOD","رياضيات","باقي القسمة","=MOD(10,3)","تعطيك باقي قسمة 10 على 3. مفيدة لمعرفة الزوجي والفردي.","1","باقي"],
["AVERAGE","إحصاء","المتوسط الحسابي","=AVERAGE(A1:A5)","تجمع القيم وتقسمها على عددها.","30","معدل متوسط"],
["AVERAGEIF","إحصاء","متوسط بشرط","=AVERAGEIF(A:A,\"جدة\",B:B)","متوسط قيم B للصفوف التي مدينتها جدة فقط.","520","معدل بشرط"],
["MAX","إحصاء","أكبر قيمة","=MAX(A1:A5)","ترجع أكبر رقم في النطاق.","50","اعلى اكبر"],
["MIN","إحصاء","أصغر قيمة","=MIN(A1:A5)","ترجع أصغر رقم في النطاق.","10","ادنى اصغر"],
["COUNT","إحصاء","عدّ الخلايا الرقمية","=COUNT(A1:A10)","تعدّ الخلايا التي فيها أرقام فقط وتتجاهل النصوص.","8","عد"],
["COUNTA","إحصاء","عدّ الخلايا غير الفارغة","=COUNTA(A1:A10)","تعدّ أي خلية فيها محتوى، رقمًا أو نصًا.","10","عد غير فارغ"],
["COUNTIF","إحصاء","عدّ بشرط","=COUNTIF(A:A,\"مكتمل\")","تعدّ كم خلية تحتوي على كلمة «مكتمل».","12","عد بشرط"],
["COUNTIFS","إحصاء","عدّ بعدة شروط","=COUNTIFS(A:A,\"جدة\",B:B,\">100\")","تعدّ الصفوف التي تحقق الشرطين معًا.","7","عد بشروط"],
["RANK","إحصاء","ترتيب رقم في قائمة","=RANK(B2,B2:B10,0)","تعطي ترتيب القيمة بين القيم، 0 يعني من الأكبر للأصغر.","3","ترتيب"],
["IF","منطق","إذا الشرطية","=IF(A1>=50,\"ناجح\",\"راسب\")","إذا تحقق الشرط تعطي القيمة الأولى، وإلا تعطي الثانية.","ناجح","اذا شرط"],

["AND","منطق","كل الشروط صحيحة","=AND(A1>0,B1>0)","ترجع TRUE فقط إذا تحقق الشرطان معًا.","TRUE","و"],
["OR","منطق","أحد الشروط صحيح","=OR(A1>0,B1>0)","ترجع TRUE إذا تحقق أي شرط منهما.","TRUE","او"],
["NOT","منطق","عكس القيمة المنطقية","=NOT(A1>5)","تحوّل TRUE إلى FALSE والعكس.","FALSE","عكس"],

["MATCH","بحث","موقع قيمة في نطاق","=MATCH(\"علي\",A2:A10,0)","ترجع رقم الموضع الذي وُجدت فيه القيمة. تُستخدم كثيرًا مع INDEX.","4","مطابقة موقع"],

["TODAY","تاريخ ووقت","تاريخ اليوم","=TODAY()","ترجع تاريخ اليوم وتتحدث تلقائيًا كل يوم.","24/10/2026","اليوم"],

["EDATE","تاريخ ووقت","إضافة أشهر لتاريخ","=EDATE(A1,3)","ترجع التاريخ بعد 3 أشهر من التاريخ في A1.","24/01/2027","شهر اضافة"],

var cats=["الكل"].concat(F.map(function(f){return f[1]}).filter(function(c,i,a){return a.indexOf(c)===i}));
var cur="الكل",q="";
var chips=document.getElementById("chips"),list=document.getElementById("list"),count=document.getElementById("count"),input=document.getElementById("q");
function norm(s){return s.toLowerCase().replace(/[\u064B-\u0652]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function drawChips(){chips.innerHTML="";cats.forEach(function(c){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cur);b.onclick=function(){cur=c;drawChips();draw()};chips.appendChild(b)})}
function draw(){
var n=norm(q.trim());
var r=F.filter(function(f){return(cur==="الكل"||f[1]===cur)&&(!n||norm(f[0]+" "+f[1]+" "+f[2]+" "+f[6]).indexOf(n)>-1)});
count.textContent=r.length+" دالة";
if(!r.length){list.innerHTML='<div class="empty">ما لقينا دالة بهذا الاسم. جرّب كلمة أخرى مثل «جمع» أو «بحث».</div>';return}
list.innerHTML=r.map(function(f,i){return '<div class="item" data-i="'+F.indexOf(f)+'"><button class="head" type="button" aria-expanded="false"><span class="name">'+f[0]+'</span><span class="short">'+f[2]+'</span><span class="cat">'+f[1]+'</span></button><div class="body"><div class="lbl">الصيغة</div><div class="code">'+esc(f[3])+'</div><div class="lbl">الشرح</div><div>'+esc(f[4])+'</div><span class="res">النتيجة: '+esc(f[5])+'</span><br><button class="cp" type="button">نسخ الصيغة</button></div></div>'}).join("");
}
list.addEventListener("click",function(e){
var item=e.target.closest(".item");if(!item)return;
if(e.target.closest(".cp")){var t=F[item.dataset.i][3],b=e.target.closest(".cp");
var done=function(){b.textContent="تم النسخ";setTimeout(function(){b.textContent="نسخ الصيغة"},1500)};
try{navigator.clipboard.writeText(t).then(done,function(){fallback(t);done()})}catch(x){fallback(t);done()}return}
if(e.target.closest(".head")){var o=item.classList.toggle("open");item.querySelector(".head").setAttribute("aria-expanded",o)}
});
function fallback(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(x){}document.body.removeChild(a)}
input.addEventListener("input",function(){q=input.value;draw()});
document.getElementById("theme").onclick=function(){var r=document.documentElement,d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",d?"light":"dark")};
drawChips();draw();
</script>
</body>
</html>
